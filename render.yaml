services:
  - type: web
    name: dtc-campus-hub
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py makemigrations core && python manage.py migrate && python manage.py collectstatic --noinput && python manage.py seed_demo"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: dtc-campus-db
          property: connectionString
      - key: CLOUDINARY_URL
        sync: false
    autoDeploy: true

databases:
  - name: dtc-campus-db
    plan: free
