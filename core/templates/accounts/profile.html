{% extends 'base.html' %}{% block content %}<section class="auth"><div class="authcard wide"><span class="eyebrow">YOUR PROFILE</span><h1>Edit profile</h1><form method="post">{% csrf_token %}<div class="formgrid"><label>First name<input name="first_name" value="{{ user.first_name }}"></label><label>Last name<input name="last_name" value="{{ user.last_name }}"></label><label>Email<input value="{{ user.email }}" disabled></label><label>University<input name="university" value="{{ user.university }}" placeholder="GGSIPU / AKTU"></label><label>Course<input name="course" value="{{ user.course }}"></label><label>Branch<input name="branch" value="{{ user.branch }}"></label></div><label>Bio<textarea name="bio">{{ user.bio }}</textarea></label><button class="btn">Save changes</button></form></div></section>{% endblock %}
