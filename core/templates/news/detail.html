{% extends 'base.html' %}{% block content %}<article class="articlepage"><span class="eyebrow">{% if item.organization %}{{ item.organization.name }}{% else %}DTC NEWS{% endif %}</span><h1>{{ item.title }}</h1><p class="lead">{{ item.excerpt }}</p><p class="muted">{{ item.published_at|date:'d F Y · g:i A' }}</p>{% if item.image %}<img class="articleimg" src="{{ item.image.url }}">{% endif %}<div class="articletext">{{ item.content|linebreaks }}</div></article>{% endblock %}
